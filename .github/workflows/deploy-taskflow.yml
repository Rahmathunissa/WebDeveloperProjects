
name: Deploy TaskFlow

on:
  push:
    branches:
      - main
    paths:
      - 'Landing Page lab/03-saas-react/**'
      - '.github/workflows/deploy-taskflow.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: taskflow-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: Landing Page lab/03-saas-react
        run: npm ci

      - name: Build TaskFlow
        working-directory: Landing Page lab/03-saas-react
        run: npm run build

      - name: Prepare website
        run: |
          mkdir -p _site
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='node_modules/' --exclude='dist/' --exclude='_site/' ./ _site/
          mkdir -p "_site/Landing Page lab/03-saas-react"
          cp -R "Landing Page lab/03-saas-react/dist/." "_site/Landing Page lab/03-saas-react/"

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
