
name: Deploy TaskFlow

on:
  push:
    branches:
      - main
    paths:
      - "landing-pages/03-saas-react/**"
      - ".github/workflows/deploy-taskflow.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: taskflow-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check repository folders
        run: |
          pwd
          ls -la
          ls -la landing-pages/03-saas-react
  
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: landing-pages/03-saas-react
        run: npm ci

      - name: Build React project
        working-directory: landing-pages/03-saas-react
        run: npm run build

      - name: Upload build
        uses: actions/upload-pages-artifact@v3
        with:
          path: landing-pages/03-saas-react/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
