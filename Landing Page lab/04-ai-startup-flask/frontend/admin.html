
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuraFlow AI | Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'DM Sans', sans-serif;
            background: #F7F8F2;
            color: #243B38;
        }

        .sidebar {
            min-height: 100vh;
            background: #243B38;
            color: white;
            padding: 30px 22px;
        }

        .brand {
            font-size: 21px;
            font-weight: 700;
            margin-bottom: 45px;
        }

        .brand span {
            color: #36B6A0;
        }

        .sidebar a {
            display: block;
            color: #D4E4DE;
            text-decoration: none;
            padding: 13px;
            border-radius: 9px;
            margin-bottom: 8px;
        }

        .sidebar a.active {
            background: #159C88;
            color: white;
        }

        .main-content {
            padding: 40px;
        }

        .stat-card,
        .table-card {
            background: white;
            border: 1px solid #E5ECE7;
            border-radius: 16px;
            padding: 25px;
        }

        .stat-number {
            font-size: 36px;
            font-weight: 700;
            margin-top: 10px;
        }

        .table-card {
            margin-top: 28px;
            overflow-x: auto;
        }

        .table th {
            color: #71817B;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
        }

        .table td {
            padding-top: 17px;
            padding-bottom: 17px;
            vertical-align: middle;
        }

        .message-cell {
            min-width: 220px;
            max-width: 350px;
            white-space: normal;
            overflow-wrap: anywhere;
        }

        .status-message {
            color: #71817B;
            padding: 25px 0;
        }

        #loginSection {
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        @media (max-width: 768px) {
            .sidebar {
                min-height: auto;
            }

            .main-content {
                padding: 22px 15px;
            }
        }
    </style>
</head>

<body>

<!-- Admin Login -->
<section id="loginSection" class="container py-5">
    <div class="row justify-content-center w-100">
        <div class="col-md-5 col-lg-4">
            <div class="card shadow border-0 p-4">

                <div class="text-center mb-4">
                    <h3>NeuraFlow AI</h3>
                    <p class="text-muted">Admin Dashboard Login</p>
                </div>

                <form id="loginForm">
                    <div class="mb-3">
                        <label for="adminPassword" class="form-label">
                            Admin Password
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            id="adminPassword"
                            placeholder="Enter admin password"
                            required
                        >
                    </div>

                    <button
                        type="submit"
                        class="btn btn-success w-100"
                        id="loginButton"
                    >
                        Login
                    </button>

                    <p id="loginMessage" class="mt-3 text-danger"></p>
                </form>

            </div>
        </div>
    </div>
</section>


<!-- Admin Dashboard -->
<div class="container-fluid" id="adminDashboard" style="display: none;">

    <div class="row">

        <!-- Sidebar -->
        <aside class="col-md-3 col-lg-2 sidebar">

            <div class="brand">
                NeuraFlow<span> AI</span>
            </div>

            <a href="admin.html" class="active">
                <i class="bi bi-grid me-2"></i>
                Dashboard
            </a>

            <a href="index.html">
                <i class="bi bi-globe me-2"></i>
                View Website
            </a>

        </aside>


        <!-- Main Content -->
        <main class="col-md-9 col-lg-10 main-content">

            <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">

                <div>
                    <h2 class="fw-bold">Dashboard</h2>
                    <p class="text-secondary mb-0">
                        Manage your website enquiries.
                    </p>
                </div>

                <div class="d-flex gap-2">

                    <button class="btn btn-success" id="refreshButton">
                        <i class="bi bi-arrow-clockwise me-2"></i>
                        Refresh
                    </button>

                    <button
                        type="button"
                        class="btn btn-outline-danger"
                        id="logoutButton"
                    >
                        <i class="bi bi-box-arrow-right me-1"></i>
                        Logout
                    </button>

                </div>
            </div>


            <!-- Statistics -->
            <div class="row g-4">

                <div class="col-md-5 col-lg-4">

                    <div class="stat-card">

                        <div class="text-secondary">
                            Total Enquiries
                        </div>

                        <div class="stat-number" id="totalEnquiries">
                            --
                        </div>

                        <small class="text-success">
                            <i class="bi bi-envelope-check"></i>
                            Saved in SQLite
                        </small>

                    </div>

                </div>

            </div>


            <!-- Enquiry Table -->
            <div class="table-card">

                <div class="d-flex justify-content-between align-items-center mb-3">

                    <h5 class="fw-bold mb-0">
                        Recent Enquiries
                    </h5>

                    <span class="badge text-bg-success">
                        Live data
                    </span>

                </div>

                <div class="table-responsive">

                    <table class="table table-hover">

                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Message</th>
                                <th>Date</th>
                                <th>Action</th>
                            </tr>
                        </thead>

                        <tbody id="enquiryTable">
                            <tr>
                                <td colspan="6" class="status-message">
                                    Login to view enquiries.
                                </td>
                            </tr>
                        </tbody>

                    </table>

                </div>

                <p id="errorMessage" class="text-danger mb-0"></p>

            </div>

        </main>

    </div>

</div>


<script>
    // API configuration
    const API_BASE = "http://127.0.0.1:5000/api";

    // HTML elements
    const loginForm = document.getElementById("loginForm");
    const loginSection = document.getElementById("loginSection");
    const adminDashboard = document.getElementById("adminDashboard");

    const loginMessage = document.getElementById("loginMessage");
    const loginButton = document.getElementById("loginButton");

    const table = document.getElementById("enquiryTable");
    const total = document.getElementById("totalEnquiries");
    const errorMessage = document.getElementById("errorMessage");


    // Show login screen
    function showLogin() {
        loginSection.style.display = "flex";
        adminDashboard.style.display = "none";
    }


    // Show dashboard
    function showDashboard() {
        loginSection.style.display = "none";
        adminDashboard.style.display = "block";
    }


    // Check whether the admin session is active
    async function checkAdminSession() {

        try {
            const response = await fetch(
                `${API_BASE}/admin/status`,
                {
                    method: "GET",
                    credentials: "include"
                }
            );

            const data = await response.json();

            if (response.ok && data.logged_in) {
                showDashboard();
                await loadEnquiries();
            } else {
                showLogin();
            }

        } catch (error) {
            console.error("Session check failed:", error);
            showLogin();
            loginMessage.textContent =
                "Cannot connect to the server. Start Flask and try again.";
        }
    }


    // Admin login
    loginForm.addEventListener("submit", async function(event) {

        event.preventDefault();

        const password =
            document.getElementById("adminPassword").value;

        loginMessage.textContent = "";
        loginButton.disabled = true;
        loginButton.textContent = "Logging in...";

        try {
            const response = await fetch(
                `${API_BASE}/admin/login`,
                {
                    method: "POST",
                    credentials: "include",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        password: password
                    })
                }
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.message || "Login failed.");
            }

            // Verify the session cookie was accepted
            const statusResponse = await fetch(
                `${API_BASE}/admin/status`,
                {
                    method: "GET",
                    credentials: "include"
                }
            );

            const statusData = await statusResponse.json();

            if (!statusResponse.ok || !statusData.logged_in) {
                throw new Error(
                    "Login succeeded but the session was not established."
                );
            }

            loginForm.reset();
            showDashboard();

            await loadEnquiries();

        } catch (error) {
            console.error("Login error:", error);
            loginMessage.textContent = error.message;

        } finally {
            loginButton.disabled = false;
            loginButton.textContent = "Login";
        }

    });


    // Load enquiries from Flask API
    async function loadEnquiries() {

        table.innerHTML = `
            <tr>
                <td colspan="6" class="status-message">
                    Loading enquiries...
                </td>
            </tr>
        `;

        errorMessage.textContent = "";

        try {
            const response = await fetch(
                `${API_BASE}/enquiries`,
                {
                    method: "GET",
                    credentials: "include"
                }
            );

            const result = await response.json();

            if (response.status === 401) {
                showLogin();
                throw new Error("Your session has expired. Please log in again.");
            }

            if (!response.ok) {
                throw new Error(
                    result.message || "Unable to load enquiries."
                );
            }

            if (result.status !== "success") {
                throw new Error(
                    result.message || "Unexpected server response."
                );
            }

            const enquiries = result.enquiries || [];

            total.textContent = enquiries.length;

            if (enquiries.length === 0) {
                table.innerHTML = `
                    <tr>
                        <td colspan="6" class="status-message">
                            No enquiries received yet.
                        </td>
                    </tr>
                `;
                return;
            }

            table.innerHTML = "";

            enquiries.forEach(enquiry => {

                const row = document.createElement("tr");

                const values = [
                    enquiry.id,
                    enquiry.name,
                    enquiry.email,
                    enquiry.message,
                    enquiry.created_at
                ];

                values.forEach((value, index) => {

                    const cell = document.createElement("td");

                    cell.textContent = value ?? "";

                    if (index === 3) {
                        cell.className = "message-cell";
                    }

                    row.appendChild(cell);

                });


                // Delete action
                const actionCell = document.createElement("td");

                const deleteButton =
                    document.createElement("button");

                deleteButton.type = "button";
                deleteButton.className =
                    "btn btn-sm btn-outline-danger";

                deleteButton.innerHTML =
                    '<i class="bi bi-trash"></i> Delete';

                deleteButton.addEventListener("click", function() {
                    deleteEnquiry(enquiry.id);
                });

                actionCell.appendChild(deleteButton);
                row.appendChild(actionCell);

                table.appendChild(row);

            });

        } catch (error) {

            console.error("Loading enquiries failed:", error);

            total.textContent = "--";

            table.innerHTML = `
                <tr>
                    <td colspan="6" class="status-message">
                        Unable to load enquiries.
                    </td>
                </tr>
            `;

            errorMessage.textContent = error.message;

        }

    }


    // Delete an enquiry
    async function deleteEnquiry(id) {

        const confirmed = confirm(
            "Are you sure you want to delete this enquiry?"
        );

        if (!confirmed) return;

        try {
            const response = await fetch(
                `${API_BASE}/enquiries/${id}`,
                {
                    method: "DELETE",
                    credentials: "include"
                }
            );

            const result = await response.json();

            if (response.status === 401) {
                showLogin();
                throw new Error("Your session has expired. Please log in again.");
            }

            if (!response.ok) {
                throw new Error(
                    result.message || "Unable to delete enquiry."
                );
            }

            alert("Enquiry deleted successfully!");

            await loadEnquiries();

        } catch (error) {
            console.error("Delete error:", error);
            alert(error.message);
        }

    }


    // Refresh button
    document.getElementById("refreshButton")
        .addEventListener("click", loadEnquiries);


    // Logout
    document.getElementById("logoutButton")
        .addEventListener("click", logoutAdmin);

    async function logoutAdmin() {

        try {
            const response = await fetch(
                `${API_BASE}/admin/logout`,
                {
                    method: "POST",
                    credentials: "include"
                }
            );

            if (!response.ok) {
                throw new Error("Logout request failed.");
            }

            loginForm.reset();
            loginMessage.textContent = "";

            total.textContent = "--";

            table.innerHTML = `
                <tr>
                    <td colspan="6" class="status-message">
                        Login to view enquiries.
                    </td>
                </tr>
            `;

            showLogin();

        } catch (error) {
            console.error("Logout failed:", error);
            alert("Could not log out. Please try again.");
        }

    }


    // Initial page load: check session before showing enquiries
    checkAdminSession();

</script>

</body>
</html>
